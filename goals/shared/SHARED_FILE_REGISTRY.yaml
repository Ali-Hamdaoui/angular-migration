version: 2
integration_coordinator_owned:
  - backend/app/api/router.py
  - backend/app/core/application.py
  - backend/app/domain/contracts.py
  - backend/app/orchestration/state.py
  - backend/app/repositories/models/workflow.py
  - backend/app/state/transition_service.py
  - frontend/src/components/AuthoritativeRunDashboard.tsx
  - frontend/src/hooks/useMigrationEvents.ts
  - frontend/src/hooks/applyEventToRun.ts
  - frontend/src/types/generated/api.ts
  - shared/openapi.json
  - frontend/package-lock.json
  - backend/pyproject.toml
  - backend/alembic/versions/**
rules:
  - goal branches may edit a hotspot only when required by their feature and declared before writing
  - every edit is listed in evidence/shared-file-changes.json with reason and integration notes
  - aggregate generated files are regenerated once during integration
  - no branch silently overwrites another goal contract
