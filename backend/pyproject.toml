[project]
name = "ai-frontend-migration-factory-backend"
version = "0.1.0"
description = "FastAPI execution-authority shell for the AI Frontend Migration Factory."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.0,<3.0", "sqlalchemy>=2.0,<3.0", "alembic>=1.14,<2.0", "langgraph>=0.2,<1.0"]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.12,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".pytest_cache", ".s1f09-persistence-test"]
lint.ignore = ["E701", "E702", "E703", "F401", "F841", "E401"]
